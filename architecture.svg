<svg viewBox="0 0 1180 952" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C2410C"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0D9488"/>
    </marker>
    <marker id="arrN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1180" height="952" fill="#FBFBF9"/>

  <!-- Title -->
  <text x="60" y="46" font-size="13" letter-spacing="3.5" font-weight="700" fill="#334155">CROSS-MODEL ADVERSARIAL CODE REVIEW</text>
  <text x="60" y="66" font-size="12" fill="#94A3B8">Three-arm evaluation with a symmetry control — does a different model family catch what self-review misses?</text>

  <!-- Legend -->
  <rect x="878" y="30" width="12" height="12" rx="2" fill="#C2410C"/>
  <text x="896" y="41" font-size="11.5" fill="#475569">claude family</text>
  <rect x="988" y="30" width="12" height="12" rx="2" fill="#0D9488"/>
  <text x="1006" y="41" font-size="11.5" fill="#475569">gpt family</text>

  <!-- Task corpus -->
  <rect x="430" y="92" width="320" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="590" y="115" font-size="13.5" font-weight="600" fill="#1E293B" text-anchor="middle">Task corpus (×10)</text>
  <text x="590" y="133" font-size="11" fill="#64748B" text-anchor="middle">realistic backend components, defects unflagged</text>

  <!-- Task → generators -->
  <path d="M 500 146 C 430 172, 350 176, 296 196" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrN)"/>
  <path d="M 680 146 C 750 172, 830 176, 884 196" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrN)"/>

  <!-- Generator A -->
  <rect x="120" y="200" width="320" height="72" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="120" y="200" width="5" height="72" rx="2.5" fill="#C2410C"/>
  <text x="142" y="228" font-size="13.5" font-weight="600" fill="#1E293B">Generator A</text>
  <text x="142" y="250" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#C2410C">claude-sonnet-5</text>
  <text x="142" y="266" font-size="10.5" fill="#94A3B8">temperature omitted · thinking on</text>

  <!-- Generator B -->
  <rect x="740" y="200" width="320" height="72" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
  <rect x="740" y="200" width="5" height="72" rx="2.5" fill="#0D9488"/>
  <text x="762" y="228" font-size="13.5" font-weight="600" fill="#1E293B">Generator B</text>
  <text x="762" y="250" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#0D9488">gpt-5.6-terra</text>
  <text x="762" y="266" font-size="10.5" fill="#94A3B8">reasoning_effort pinned · same prompt</text>

  <!-- Generators → ledger -->
  <path d="M 280 272 L 280 330" fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#arrA)"/>
  <text x="292" y="308" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#C2410C">code_A</text>
  <path d="M 900 272 L 900 330" fill="none" stroke="#0D9488" stroke-width="1.6" marker-end="url(#arrB)"/>
  <text x="912" y="308" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#0D9488">code_B</text>

  <!-- Ground-truth ledger band -->
  <rect x="120" y="336" width="940" height="104" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text x="144" y="364" font-size="13.5" font-weight="600" fill="#1E293B">Ground-truth defect ledger</text>
  <text x="144" y="384" font-size="11.5" fill="#64748B">dual auditors, candidates unioned · every defect tagged with category + origin generator</text>

  <rect x="144" y="398" width="150" height="26" rx="13" fill="#FFF7ED" stroke="#C2410C" stroke-width="1"/>
  <text x="219" y="415" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#C2410C" text-anchor="middle">claude-opus-5</text>
  <text x="312" y="416" font-size="13" fill="#64748B" text-anchor="middle">∪</text>
  <rect x="330" y="398" width="140" height="26" rx="13" fill="#F0FDFA" stroke="#0D9488" stroke-width="1"/>
  <text x="400" y="415" font-size="11.5" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#0D9488" text-anchor="middle">gpt-5.6-sol</text>
  <text x="486" y="415" font-size="11" fill="#94A3B8">proposed_by recorded</text>

  <rect x="676" y="394" width="364" height="34" rx="8" fill="#14532D"/>
  <text x="858" y="410" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">HUMAN-CONFIRMED, ENTRY BY ENTRY</text>
  <text x="858" y="423" font-size="10" fill="#BBF7D0" text-anchor="middle">scoring hard-blocked until every candidate is resolved</text>

  <!-- Ledger → review arms. Cross arrows deliberately intersect. -->
  <path d="M 280 440 C 280 472, 230 486, 208 512" fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#arrA)"/>
  <path d="M 280 440 C 340 480, 620 468, 712 512" fill="none" stroke="#C2410C" stroke-width="1.6" marker-end="url(#arrA)"/>
  <path d="M 900 440 C 840 480, 560 468, 468 512" fill="none" stroke="#0D9488" stroke-width="1.6" marker-end="url(#arrB)"/>
  <path d="M 900 440 C 900 472, 950 486, 972 512" fill="none" stroke="#0D9488" stroke-width="1.6" marker-end="url(#arrB)"/>

  <!-- Review arm boxes: border = reviewer family, arrow in = code origin -->
  <!-- 1: SELF claude→claude -->
  <rect x="90" y="516" width="220" height="96" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.6"/>
  <rect x="106" y="530" width="46" height="20" rx="10" fill="#F1F5F9"/>
  <text x="129" y="544" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">SELF</text>
  <text x="106" y="572" font-size="12.5" font-weight="600" fill="#1E293B">claude reviews</text>
  <text x="106" y="590" font-size="12.5" font-weight="600" fill="#C2410C">claude's code</text>

  <!-- 2: CROSS — claude reviews gpt's code -->
  <rect x="350" y="516" width="220" height="96" rx="10" fill="#FFFFFF" stroke="#C2410C" stroke-width="1.6"/>
  <rect x="366" y="530" width="58" height="20" rx="10" fill="#1E293B"/>
  <text x="395" y="544" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CROSS</text>
  <text x="366" y="572" font-size="12.5" font-weight="600" fill="#1E293B">claude reviews</text>
  <text x="366" y="590" font-size="12.5" font-weight="600" fill="#0D9488">gpt's code</text>

  <!-- 3: CROSS — gpt reviews claude's code -->
  <rect x="610" y="516" width="220" height="96" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <rect x="626" y="530" width="58" height="20" rx="10" fill="#1E293B"/>
  <text x="655" y="544" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">CROSS</text>
  <text x="626" y="572" font-size="12.5" font-weight="600" fill="#1E293B">gpt reviews</text>
  <text x="626" y="590" font-size="12.5" font-weight="600" fill="#C2410C">claude's code</text>

  <!-- 4: SELF -->
  <rect x="870" y="516" width="220" height="96" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.6"/>
  <rect x="886" y="530" width="46" height="20" rx="10" fill="#F1F5F9"/>
  <text x="909" y="544" font-size="10.5" font-weight="700" fill="#64748B" text-anchor="middle">SELF</text>
  <text x="886" y="572" font-size="12.5" font-weight="600" fill="#1E293B">gpt reviews</text>
  <text x="886" y="590" font-size="12.5" font-weight="600" fill="#0D9488">gpt's code</text>

  <text x="590" y="642" font-size="11" font-style="italic" fill="#94A3B8" text-anchor="middle">reviewers run independently — never see each other's findings · authorship withheld · prompts byte-identical</text>

  <!-- Arms → normalizer -->
  <path d="M 200 612 C 220 664, 320 682, 384 694" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrN)"/>
  <path d="M 460 612 C 470 650, 500 672, 520 692" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrN)"/>
  <path d="M 720 612 C 710 650, 680 672, 660 692" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrN)"/>
  <path d="M 980 612 C 960 664, 860 682, 796 694" fill="none" stroke="#64748B" stroke-width="1.3" marker-end="url(#arrN)"/>

  <!-- Normalizer -->
  <rect x="340" y="698" width="500" height="58" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="590" y="722" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Finding normalizer</text>
  <text x="590" y="740" font-size="11" fill="#64748B" text-anchor="middle">loose JSON → canonical schema · dedupe · parse failure ≠ zero findings</text>

  <path d="M 590 756 L 590 786" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrN)"/>

  <!-- Scorer -->
  <rect x="340" y="790" width="500" height="58" rx="10" fill="#1E293B"/>
  <text x="590" y="814" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Blind scoring harness</text>
  <text x="590" y="832" font-size="11" fill="#94A3B8" text-anchor="middle">arm derived after matching · one claim per defect · errored runs block scoring</text>

  <path d="M 590 848 L 590 876" fill="none" stroke="#64748B" stroke-width="1.4" marker-end="url(#arrN)"/>

  <!-- Outputs -->
  <rect x="150" y="882" width="500" height="44" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="400" y="901" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">recall · precision · FPR · cost per catch</text>
  <text x="400" y="917" font-size="10.5" fill="#64748B" text-anchor="middle">per defect category, Wilson 95% CIs</text>

  <rect x="678" y="882" width="352" height="44" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="854" y="901" font-size="12" font-weight="600" fill="#1E293B" text-anchor="middle">symmetry verdict</text>
  <text x="854" y="917" font-size="10.5" fill="#64748B" text-anchor="middle">diversity · capability-confound · no-effect</text>
</svg>
