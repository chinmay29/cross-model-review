- defect_id: 427df08e105a
  task_id: rate_limiter
  origin: claude
  category: missing-edge-case
  file: rate_limiter.py
  line_start: 44
  line_end: 45
  description: Wall-clock timestamps are used for a monotonic-interval problem. If
    `clock.now()` returns a naive datetime, `.timestamp()` interprets it in local
    time (DST shifts) and any backward clock jump inserts out-of-order values into
    the deque; `_evict_expired` only pops from the front while `window[0] <= cutoff`,
    so an unsorted deque leaves newer-looking entries in front and stops eviction,
    permanently skewing the limit.
  severity: minor
  source: audit
  confirmed: true
  proposed_by:
  - claude_auditor
- defect_id: 4a7a94bf7d19
  task_id: rate_limiter
  origin: gpt
  category: concurrency
  file: rate_limiter.py
  line_start: 46
  line_end: 70
  description: The timestamp `now` (and `cutoff`) are read from `clock.now()` outside
    the lock and only used after acquiring it. Two threads can therefore append timestamps
    to the same deque out of chronological order, which breaks the invariant that
    the deque is sorted ascending; the `while requests[0] <= cutoff` pruning loop
    stops at the first non-expired head and so can leave stale entries permanently,
    causing incorrect (over-strict or under-strict) limiting. `now` must be sampled
    inside the critical section.
  severity: major
  source: audit
  confirmed: true
  proposed_by:
  - claude_auditor
  - gpt_auditor
